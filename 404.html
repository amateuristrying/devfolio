<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Not Found | Abhiroop</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .error-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
            padding: 20px;
        }
        .error-container h1 {
            font-size: 5rem;
            margin: 0;
            color: #C4E6A8;
        }
        .error-container p {
            font-size: 1.2rem;
            margin: 16px 0 24px;
        }
        .back-link {
            display: inline-block;
            padding: 10px 24px;
            background: #C4E6A8;
            color: #111;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="error-container">
        <h1>404</h1>
        <p>Page not found</p>
        <a href="/" class="back-link">Back to Home</a>
    </div>
</body>
</html>
